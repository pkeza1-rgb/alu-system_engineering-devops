<!DOCTYPE html>
<html lang="en">
<head>
	<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .container {
        max-width: 650px;
    }

    h1 {
        font-size: 130px;
        color: #a78bfa;
        margin-bottom: 10px;
    }

    h2 {
        font-size: 30px;
        margin-bottom: 20px;
    }

    p {
        color: #cbd5e1;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    .button {
        display: inline-block;
        background: #7c3aed;
        color: white;
        padding: 13px 28px;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.3s ease;
    }

    .button:hover {
        background: #6d28d9;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 90px;
        }

        h2 {
            font-size: 23px;
        }
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
</head>
<body>
	<body>
    <main class="container">
        <h1>404</h1>

        <h2>Oops! You've Lost Your Way.</h2>

        <p>
            Looks like you've wandered into the unknown.
            The page you're looking for doesn't exist or
            may have been moved.
        </p>

        <p>Ceci n'est pas une page</p>

        <a href="/" class="button">Take Me Home</a>
    </main>
</body>
</html>
